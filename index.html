<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HUNTER-IA | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-page">

    <div class="login-container">

        <div class="login-brand">
            <h1>HUNTER<span>-IA</span></h1>
            <p>INTELIGÊNCIA PARA VENDER</p>
        </div>

        <div class="login-card">

            <div class="login-status">
                <span class="status-dot"></span>
                SISTEMA ONLINE
            </div>

            <h2>Bem-vindo de volta</h2>

            <p class="login-subtitle">
                Entre na sua conta para acessar o HUNTER-IA
            </p>

            <div id="loginMessage" class="login-message"></div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Usuário
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="username"
                            placeholder="Digite seu usuário"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Senha
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            Mostrar
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Lembrar meu acesso

                    </label>

                    <a
                        href="#"
                        class="forgot-password"
                        onclick="return false;"
                    >
                        Esqueci minha senha
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    ENTRAR NO HUNTER-IA
                </button>

            </form>

            <div class="login-footer">
                HUNTER-IA • Inteligência que transforma oportunidades em vendas.
                <br>
                © 2026 HUNTER-IA. Todos os direitos reservados.
            </div>

        </div>

    </div>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const usernameInput =
        document.getElementById("username");

    const passwordInput =
        document.getElementById("password");

    const loginMessage =
        document.getElementById("loginMessage");

    const togglePassword =
        document.getElementById("togglePassword");


    /* =========================================
       MOSTRAR / ESCONDER SENHA
       ========================================= */

    togglePassword.addEventListener("click", function () {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";

            togglePassword.textContent = "Ocultar";

        } else {

            passwordInput.type = "password";

            togglePassword.textContent = "Mostrar";

        }

    });


    /* =========================================
       LOGIN
       ========================================= */

    loginForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value.trim();


        if (!username || !password) {

            loginMessage.textContent =
                "Digite seu usuário e sua senha.";

            loginMessage.style.display = "block";

            return;

        }


        /*
         * LOGIN TEMPORÁRIO
         *
         * Nesta primeira versão qualquer
         * usuário + senha preenchidos entram.
         *
         * Depois vamos trocar isso por
         * autenticação REAL com banco de dados.
         */

        localStorage.setItem(
            "hunter_username",
            username
        );


        localStorage.setItem(
            "hunter_logged",
            "true"
        );


        if (
            document.getElementById("remember").checked
        ) {

            localStorage.setItem(
                "hunter_remember",
                "true"
            );

        }


        loginMessage.style.display = "none";


        window.location.href =
            "dashboard.html";

    });


    /* =========================================
       SE JÁ ESTIVER LOGADO
       ========================================= */

    if (
        localStorage.getItem("hunter_logged") === "true"
    ) {

        window.location.href =
            "dashboard.html";

    }

</script>

</body>
</html>
